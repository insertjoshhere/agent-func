[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "database-agnostic-ai-retrieval"
version = "0.1.0"
description = "Minimal contracts for exclusive interactive and bulk AI retrieval admission"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["hypothesis==6.151.12"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
